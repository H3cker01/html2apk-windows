name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Copy JDK into tools
        shell: pwsh
        run: |
          $dst = "Html2Apk\Assets\tools\jdk"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item "$env:JAVA_HOME\*" $dst -Recurse -Force

      - name: Download Gradle 8.7
        shell: pwsh
        run: |
          $dst = "Html2Apk\Assets\tools\gradle"
          Invoke-WebRequest "https://services.gradle.org/distributions/gradle-8.7-bin.zip" -OutFile gradle.zip -UseBasicParsing
          Expand-Archive gradle.zip -DestinationPath gradle_ext -Force
          $sub = Get-ChildItem gradle_ext -Directory | Select-Object -First 1
          Move-Item $sub.FullName $dst -Force
          Remove-Item gradle.zip, gradle_ext -Recurse -Force

      - name: Setup Android SDK
        shell: pwsh
        run: |
          $sdkDir = "Html2Apk\Assets\tools\android-sdk"
          $ctDir  = "$sdkDir\cmdline-tools\latest"
          $sdkMgr = "$ctDir\bin\sdkmanager.bat"
          Invoke-WebRequest "https://dl.google.com/android/repository/commandlinetools-win-11076708_latest.zip" -OutFile ct.zip -UseBasicParsing
          New-Item -ItemType Directory -Force -Path $ctDir | Out-Null
          Expand-Archive ct.zip -DestinationPath ct_ext -Force
          Get-ChildItem ct_ext\cmdline-tools | ForEach-Object { Move-Item $_.FullName $ctDir -Force }
          Remove-Item ct.zip, ct_ext -Recurse -Force
          "y`ny`ny`ny`ny`ny`n" | & "$sdkMgr" --sdk_root="$sdkDir" --licenses 2>&1 | Out-Null
          & "$sdkMgr" --sdk_root="$sdkDir" "platforms;android-36" "build-tools;35.0.0" | Out-Null

      - name: Build
        shell: pwsh
        run: |
          dotnet publish Html2Apk/Html2Apk.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish

      - name: Zip release
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath Html2Apk-Windows.zip -Force

      - name: Create Release and Upload
        shell: pwsh
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          $headers = @{ Authorization = "token $env:GH_PAT"; "Content-Type" = "application/json" }
          $tag = "v1.0.${{ github.run_number }}"
          $body = @{ tag_name = $tag; name = "HTML2Apk for Windows $tag"; body = "Automated release"; target_commitish = "main" } | ConvertTo-Json
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/H3cker01/html2apk-windows/releases" -Method Post -Headers $headers -Body $body
          $uploadUrl = $release.upload_url -replace '\{.*\}', ''
          $uploadHeaders = @{ Authorization = "token $env:GH_PAT"; "Content-Type" = "application/zip" }
          Invoke-RestMethod -Uri "${uploadUrl}?name=Html2Apk-Windows.zip" -Method Post -Headers $uploadHeaders -InFile "Html2Apk-Windows.zip"
          Write-Host "Release published: $($release.html_url)"
